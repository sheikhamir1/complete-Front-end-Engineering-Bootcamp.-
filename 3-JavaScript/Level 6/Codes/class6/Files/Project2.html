<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Implicit Try...Catch</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding-top: 50px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 300px;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      #output {
        margin-top: 20px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Process User Data</h2>
      <button id="processBtn">Process</button>
      <p id="output">Waiting...</p>
    </div>
    <script>
      const outputText = document.getElementById("output");
      const button = document.getElementById("processBtn");

      button.addEventListener("click", () => {
        outputText.style.color = "black";

        let myPromise = new Promise((resolve, reject) => {
          resolve("User Data Loaded"); // Success!
        });

        myPromise
          .then(function (message) {
            // console.log(message);

            outputText.innerText = message;

            // Let's pretend we made a typo here!
            // We are trying to call formatData() but it doesn't exist.
            formatData(message);

            return "Next step"; // This will never run
          })
          .catch(function (error) {
            console.log(error);

            // The typo triggers the catch!
            outputText.style.color = "orange";
            outputText.innerText = `Dev Mistake Caught: ${error.name} - ${error.message}`;
          });
        console.log(myPromise);
      });
    </script>
  </body>
</html>
