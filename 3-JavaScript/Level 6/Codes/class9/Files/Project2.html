<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iterable Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding-top: 50px;
        background-color: #2c3e50;
        color: white;
      }
      .container {
        background: #34495e;
        padding: 30px;
        border-radius: 8px;
        width: 350px;
      }
      button {
        padding: 10px;
        width: 100%;
        background-color: #27ae60;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      li {
        background: #ecf0f1;
        color: #2c3e50;
        margin: 5px 0;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Number Range Generator</h2>
      <button id="generateBtn">Generate Range (1 to 10)</button>
      <ul id="numberList"></ul>
    </div>
    <script>
      // 1. Define a highly reusable generator
      function* generateRange(start, end) {
        for (let i = start; i <= end; i++) {
          // We use yield inside a regular loop!
          // This pauses the generator at every iteration.
          yield i;
        }
        // Notice: No return statement here. We yield everything.
      }
      //   const range = generateRange(1, 10);
      //   console.log(range);

      const btn = document.getElementById("generateBtn");
      const list = document.getElementById("numberList");

      btn.addEventListener("click", () => {
        list.innerHTML = ""; // Clear list

        // 2. Initialize the generator
        const range = generateRange(1, 10);
        console.log(range.next());
        console.log(range.next());

        // 3. Use standard for..of loop to extract values automatically
        for (let number of range) {
          const li = document.createElement("li");
          li.innerText = `Generated Number: ${number}`;
          list.appendChild(li);
        }

        // Optional: Demonstrating Spread Syntax (Logs [10, 11, 12, 13, 14, 15] to console)
        const arrayVersion = [...generateRange(1, 11)];
        console.log("Spread Syntax Array:", arrayVersion);
      });
    </script>
  </body>
</html>
