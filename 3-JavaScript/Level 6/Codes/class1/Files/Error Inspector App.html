<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Object Inspector</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background-color: #2c3e50;
        color: white;
      }

      .container {
        background-color: #34495e;
        padding: 30px;
        border-radius: 8px;
        max-width: 600px;
        margin: 0 auto;
      }

      button {
        background-color: #f1c40f;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 4px;
      }

      .hidden {
        display: none;
      }

      #error-display {
        margin-top: 20px;
        background-color: #1a252f;
        padding: 20px;
        border-radius: 5px;
        border-left: 5px solid #e74c3c;
      }

      pre {
        background: #000;
        color: #0f0;
        padding: 10px;
        overflow-x: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Error Object Breakdown</h1>
      <button id="trigger-btn">Trigger TypeError</button>

      <div id="error-display" class="hidden">
        <h3>Error Details:</h3>
        <p><strong>Name:</strong> <span id="err-name"></span></p>
        <p><strong>Message:</strong> <span id="err-msg"></span></p>
        <p><strong>Stack Trace:</strong></p>
        <pre id="err-stack"></pre>
      </div>
    </div>
    <script>
      "use strict";
      const triggerBtn = document.getElementById("trigger-btn");
      const errorDisplay = document.getElementById("error-display");
      const errNameSpan = document.getElementById("err-name");
      const errMsgSpan = document.getElementById("err-msg");
      const errStackPre = document.getElementById("err-stack");

      triggerBtn.addEventListener("click", () => {
        try {
          // Risky code: We declare a string, then try to invoke it like a function
          const myName = "John";
          myName(); // This will trigger a TypeError
        } catch (err) {
          // We caught the error object 'err'

          // 1. Unhide the display container
          errorDisplay.classList.remove("hidden");

          // 2. Extract and display properties from the error object
          console.log(err);

          errNameSpan.textContent = err.name;
          errMsgSpan.textContent = err.message;
          errStackPre.textContent = err.stack;

          // Log to console for good measure
          console.warn("An error was handled smoothly. Details:", err);
        }
      });
    </script>
  </body>
</html>
