      body {

        background: #222;
        color: white;
        display: flex;
        justify-content: center;
        padding-top: 50px;
      }
      .app-container {
        background: #333;
        padding: 40px;
        border-radius: 12px;
        width: 400px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      button {
        width: 100%;
        padding: 12px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #2980b9;
      }
      button:disabled {
        background: #7f8c8d;
        cursor: not-allowed;
      }
      .hidden {
        display: none;
      }
      #loader {
        margin-top: 20px;
        text-align: center;
        color: #f1c40f;
      }
      #error-alert {
        margin-top: 20px;
        padding: 15px;
        background: #e74c3c;
        border-radius: 6px;
      }
      ul {
        list-style-type: none;
        padding: 0;
        margin-top: 20px;
      }
      li {
        background: #444;
        margin-bottom: 10px;
        padding: 15px;
        border-radius: 6px;
        border-left: 5px solid #2ecc71;
      }
    </style>
  </head>

            });
          } catch (err) {

            errorAlert.textContent = `Failed to load: ${err.message}`;
