<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Regular Generator Example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background-color: #eef2f3;
        display: flex;
        justify-content: center;
        padding: 50px;
      }
      .container {
        background: white;
        padding: 20px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
      }
      #output {
        margin-top: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Generator Iterable</h1>
      <button id="start-btn">Run Generator</button>
      <div id="output"></div>
    </div>
    <script>
      let range = {
        from: 1,
        to: 15,

        // Notice the asterisk (*) before the name
        *[Symbol.iterator]() {
          for (let value = this.from; value <= this.to; value++) {
            yield value;
          }
        },
      };

      const startBtn = document.getElementById("start-btn");
      const outputDiv = document.getElementById("output");

      startBtn.addEventListener("click", () => {
        outputDiv.innerHTML = "";

        for (let value of range) {
          outputDiv.innerHTML += ` ${value} `;
        }
      });
    </script>
  </body>
</html>
