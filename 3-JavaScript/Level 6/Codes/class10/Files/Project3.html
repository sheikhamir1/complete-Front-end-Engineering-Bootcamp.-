<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Async Iterable Example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background-color: #2c3e50;
        color: white;
        display: flex;
        justify-content: center;
        padding: 50px;
      }
      .container {
        background: #34495e;
        padding: 30px 50px;
        border-radius: 8px;
        text-align: center;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 4px;
      }
      #output {
        margin-top: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #f1c40f;
        min-height: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Async Iterable (1s Delay)</h1>
      <button id="start-btn">Start Streaming</button>
      <div id="output"></div>
    </div>
    <script>
      let range = {
        from: 1,
        to: 5,

        [Symbol.asyncIterator]() {
          return {
            current: this.from,
            last: this.to,

            async next() {
              // Simulating a 1-second network delay
              await new Promise((resolve) => setTimeout(resolve, 1500));

              if (this.current <= this.last) {
                return { done: false, value: this.current++ };
              } else {
                return { done: true };
              }
            },
          };
        },
      };

      const startBtn = document.getElementById("start-btn");
      const outputDiv = document.getElementById("output");

      startBtn.addEventListener("click", async () => {
        outputDiv.innerHTML = "Starting...";
        startBtn.disabled = true;

        // Note the 'await' here
        for await (let value of range) {
          outputDiv.innerHTML = `Received chunk: ${value}`;
        }

        outputDiv.innerHTML = "Stream Complete!";
        startBtn.disabled = false;
      });
    </script>
  </body>
</html>
