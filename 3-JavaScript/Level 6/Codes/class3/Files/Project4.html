        border: none;
      }

        width: 150px;
        height: 150px;
        background-color: gray;
        margin: 30px auto;
        transition: background-color 0.5s ease;
      }

    <script>
      const animateBtn = document.getElementById("animateBtn");
      const box = document.getElementById("box");

      /**
       * Classic Error-First Callback Pattern
       * callback(error, result)
       */
      function changeColor(color, delay, callback) {
        console.log(`Starting ${color} animation...`);

        // Input validation
        if (!color) {
          return callback(new Error("Color is required"), null);
        }

        if (typeof delay !== "number" || delay <= 0) {
          return callback(
            new Error("Delay must be a positive number And Greater Then 0 "),
            null,
          );
        }

        setTimeout(() => {
          // Simulate occasional failure
          const randomFailure = Math.random() < 0.2;
          // const randomFailure = false;

          if (randomFailure) {
            return callback(
              new Error(`Failed to change color to ${color}`),
              null,
            );
          }

          box.style.backgroundColor = color;

          callback(null, {
            color,
            timestamp: new Date().toLocaleTimeString(),
          });
        }, delay);
      }

      animateBtn.addEventListener("click", () => {
        console.log("Animation Started");

        changeColor("red", 1000, (error, result) => {
          if (error) {
            console.error("Step 1 Error:", error.message);
            return;
          }

          console.log("Success:", result);

          changeColor("blue", 1000, (error, result) => {
            if (error) {
              console.error("Step 2 Error:", error.message);
              return;
            }

            console.log("Success:", result);

            changeColor("green", 1000, (error, result) => {
              if (error) {
                console.error("Step 3 Error:", error.message);
                return;
              }

              console.log("Success:", result);

              changeColor("purple", 1000, (error, result) => {
                if (error) {
                  console.error("Step 4 Error:", error.message);
                  return;
                }

                console.log("Success:", result);

                changeColor("orange", 1000, (error, result) => {
                  if (error) {
                    console.error("Step 5 Error:", error.message);
                    return;
                  }

                  console.log("Success:", result);

                  console.log("Animation sequence finished successfully!");
                });
              });
            });
          });
        });
      });
    </script>
