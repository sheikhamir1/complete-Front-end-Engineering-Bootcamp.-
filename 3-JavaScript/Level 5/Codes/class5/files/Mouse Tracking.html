<!doctype html>
<html lang="en">
  <head>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      #trackArea {
        width: 100%;
        height: 200px;
        background-color: #e3f2fd;
        border: 2px dashed #2196f3;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        color: #1565c0;
        cursor: crosshair;
        user-select: none;
      }
      #details {
        margin-top: 15px;
        font-family: monospace;
        background: #222;
        color: #0f0;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Topic 4: The Event Object</h2>
    <div id="trackArea">Move your mouse here, or click!</div>
    <div id="details">Waiting for events...</div>

    <script>
      const area = document.getElementById("trackArea");
      const details = document.getElementById("details");

      // We pass 'event' (or 'e') into the function to access the security camera footage
      area.addEventListener("mousemove", function (event) {
        area.innerText = `X: ${event.clientX}, Y: ${event.clientY}`;
      });

      area.addEventListener("click", function (event) {
        details.innerHTML = `
        <strong>Event Type:</strong> ${event.type} <br>
        <strong>Coordinates:</strong> (${event.clientX}, ${event.clientY}) <br>
        <strong>Target Element Tag:</strong> ${event.currentTarget.tagName} <br>
        <strong>Shift Key Pressed?</strong> ${event.shiftKey}
      `;
      });

      // Reset when mouse leaves
      area.addEventListener("mouseout", function () {
        area.innerText = "Move your mouse here, or click!";
      });
    </script>
  </body>
</html>
