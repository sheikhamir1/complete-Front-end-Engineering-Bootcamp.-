<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Workers</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f9;
      }
      .container {
        background: white;
        padding: 20px;
        max-width: 400px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      button {
        padding: 12px;
        background: #17a2b8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        margin-bottom: 15px;
      }
      button:hover {
        background: #138496;
      }

      /* CSS Loading Spinner to prove the UI isn't frozen */
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #17a2b8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px auto;
        display: none;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #result {
        font-weight: bold;
        font-size: 18px;
        color: #333;
      }
      #testBtn {
        background: #6c757d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Web Worker Cruncher</h2>
      <p>We will count to 2 Billion on a background thread.</p>

      <div id="spinner" class="spinner"></div>
      <p id="result">Waiting for work...</p>

      <button id="startWorkerBtn">Start Background Worker</button>
      <button id="testBtn">Test UI (I am smooth!)</button>
    </div>

    <script>
      // 1. This is the code that will run in the BACKGROUND thread.
      // It has NO access to the DOM (no document.getElementById).
      const workerCode = `
      self.onmessage = function(event) {
        // We received a message from the main thread
        if (event.data === 'start') {
          let count = 0;
          // Massive blocking loop (But it's okay, we are in the background!)
          for (let i = 0; i < 2000000000; i++) {
            count++;
          }
          // Send the final result back to the main thread
          self.postMessage(count);
        }
      };
    `;

      // 2. We convert that string into a real Web Worker file via a Blob
      const blob = new Blob([workerCode], { type: "application/javascript" });
      const worker = new Worker(URL.createObjectURL(blob));

      // 3. Main Thread UI Logic
      const startWorkerBtn = document.getElementById("startWorkerBtn");
      const testBtn = document.getElementById("testBtn");
      const spinner = document.getElementById("spinner");
      const resultText = document.getElementById("result");

      testBtn.addEventListener("click", () =>
        console.log("UI is perfectly smooth!"),
      );

      startWorkerBtn.addEventListener("click", () => {
        // Update UI
        spinner.style.display = "block";
        resultText.textContent = "Crunching 2 billion numbers...";
        startWorkerBtn.disabled = true;

        // Send a message to the worker to start cooking
        worker.postMessage("start");
      });

      // 4. Listen for the response from the background worker
      worker.onmessage = function (event) {
        // The event.data contains the result (2000000000)
        spinner.style.display = "none";
        resultText.textContent = "Result: " + event.data;
        startWorkerBtn.disabled = false;
      };
    </script>
  </body>
</html>
