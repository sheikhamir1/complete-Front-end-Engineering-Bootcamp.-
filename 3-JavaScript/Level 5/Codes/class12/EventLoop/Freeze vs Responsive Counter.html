<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Event Loop Chunking Demo</title>

    <style>
      body {
        font-family: Arial;
        max-width: 700px;
        margin: auto;
        padding: 20px;
      }

      button {
        padding: 12px;
        margin: 5px;
        cursor: pointer;
      }

      .progress-container {
        width: 100%;
        height: 30px;
        background: #ddd;
        margin-top: 20px;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: green;
        transition: width 0.1s;
      }

      #status {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>CPU Heavy Task Demo</h1>

    <p>Try clicking the test button while counting is running.</p>

    <button id="blockingBtn">Start Blocking Version</button>

    <button id="chunkBtn">Start Chunked Version</button>

    <button id="testBtn">Test UI</button>

    <div class="progress-container">
      <div id="bar" class="progress-bar"></div>
    </div>

    <p id="status">Waiting...</p>

    <script>
      const bar = document.getElementById("bar");
      const status = document.getElementById("status");

      document.getElementById("testBtn").addEventListener("click", () => {
        alert("UI is responsive!");
      });

      // ------------------------
      // BLOCKING VERSION
      // ------------------------

      document.getElementById("blockingBtn").addEventListener("click", () => {
        status.textContent = "Blocking task started...";

        let total = 100000000;

        for (let i = 0; i <= total; i++) {
          const percent = (i / total) * 100;

          bar.style.width = percent + "%";
        }

        status.textContent = "Blocking task finished";
      });

      // ------------------------
      // CHUNKED VERSION
      // ------------------------

      document.getElementById("chunkBtn").addEventListener("click", () => {
        let i = 0;

        const total = 100000000;

        status.textContent = "Chunked task started...";

        function processChunk() {
          let start = i;

          while (i < start + 1000000 && i < total) {
            i++;
          }

          const percent = (i / total) * 100;

          bar.style.width = percent + "%";

          status.textContent = "Progress: " + percent.toFixed(1) + "%";

          if (i < total) {
            setTimeout(processChunk, 0);
          } else {
            status.textContent = "Chunked task finished";
          }
        }

        processChunk();
      });
    </script>
  </body>
</html>
