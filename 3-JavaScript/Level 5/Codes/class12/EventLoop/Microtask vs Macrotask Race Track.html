<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Microtask vs Macrotask</title>

    <style>
      body {
        font-family: Arial;
        max-width: 800px;
        margin: auto;
        padding: 20px;
      }

      button {
        padding: 10px;
        margin: 5px;
      }

      #logs {
        border: 1px solid #ccc;
        height: 300px;
        overflow: auto;
        padding: 10px;
        background: #f5f5f5;
      }

      .log {
        padding: 5px;
        margin: 5px 0;
      }

      .sync {
        background: #ffeaa7;
      }

      .micro {
        background: #55efc4;
      }

      .macro {
        background: #74b9ff;
      }
    </style>
  </head>
  <body>
    <h1>Microtask vs Macrotask Race</h1>

    <button id="runBtn">Run Demo</button>

    <button id="clearBtn">Clear</button>

    <div id="logs"></div>

    <script>
      const logs = document.getElementById("logs");

      function log(text, type) {
        const div = document.createElement("div");

        div.className = "log " + type;

        div.textContent = text;

        logs.append(div);
      }

      document.getElementById("runBtn").addEventListener("click", () => {
        log("1. Sync Code", "sync");

        Promise.resolve().then(() => {
          log("2. Promise Microtask", "micro");
        });

        queueMicrotask(() => {
          log("3. queueMicrotask", "micro");
        });

        setTimeout(() => {
          log("4. setTimeout Macrotask", "macro");
        }, 0);

        log("5. End of Sync Code", "sync");
      });

      document.getElementById("clearBtn").addEventListener("click", () => {
        logs.innerHTML = "";
      });
    </script>
  </body>
</html>
