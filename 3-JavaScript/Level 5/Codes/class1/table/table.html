<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Traversal Example</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>HTML Table Traversal</h1>

    <table id="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Course</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>Rohan</td>
          <td>MCA</td>
        </tr>

        <tr>
          <td>2</td>
          <td>Ahmed</td>
          <td>BCA</td>
        </tr>

        <tr>
          <td>3</td>
          <td>Ali</td>
          <td>B.Tech</td>
        </tr>
      </tbody>
    </table>

    <button id="btn">Highlight First Student Name</button>

    <script src="script.js"></script>
  </body>
</html>
