<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Coordinates Example</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      .container {
        padding: 20px;
        height: 1500px; /* Makes the page scrollable */
      }

      h2 {
        margin-bottom: 10px;
      }

      #trackArea {
        width: 100%;
        height: 3000px;
        background: #ddd;
        border: 2px dashed black;
        cursor: crosshair;
      }

      #display {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: black;
        color: lime;
        padding: 15px;
        border-radius: 5px;
        font-family: monospace;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Subtopic 2: Mouse Coordinates</h2>

      <p>
        Move your mouse inside the gray box.<br />
        Then scroll the page and move the mouse again to see the difference.
      </p>

      <div id="trackArea"></div>
    </div>

    <div id="display">Move the mouse...</div>

    <script>
      const trackArea = document.getElementById("trackArea");
      const display = document.getElementById("display");

      // Runs whenever the mouse moves inside the gray box
      trackArea.addEventListener("mousemove", function (event) {
        // Coordinates relative to the browser window
        let clientX = event.clientX;
        let clientY = event.clientY;

        // Coordinates relative to the whole webpage
        let pageX = event.pageX;
        let pageY = event.pageY;

        // Show the coordinates
        display.innerHTML = `
        Client X: ${clientX} <br>
        Client Y: ${clientY} <br><br>

        Page X: ${pageX} <br>
        Page Y: ${pageY}
    `;
      });
    </script>
  </body>
</html>
