<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancelable Custom Event Demo</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      #fileCard {
        width: 350px;
        background: white;
        padding: 20px;
        border: 3px solid #e74c3c;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
      }

      h2 {
        margin-top: 0;
        color: #c0392b;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: #e74c3c;
        color: white;
        cursor: pointer;
        margin-top: 15px;
      }

      button:hover {
        background: #c0392b;
      }

      #status {
        margin-top: 20px;
        font-weight: bold;
        color: #2c3e50;
      }
    </style>
  </head>

  <body>
    <div id="fileCard">
      <h2>📄 File Manager</h2>

      <p><strong>Important_Financial_Report.pdf</strong></p>

      <button id="deleteBtn">Delete File</button>

      <div id="status">Waiting for action...</div>
    </div>

    <script>
      const deleteBtn = document.getElementById("deleteBtn");
      const fileCard = document.getElementById("fileCard");
      const status = document.getElementById("status");

      /*=====================================================
    LISTENER (Gatekeeper)
=====================================================*/

      document.addEventListener("before-delete", function (event) {
        console.log("Custom event received by document.");

        const userConfirmed = confirm(
          "Are you sure you want to delete this file?",
        );

        if (!userConfirmed) {
          console.log("User cancelled deletion.");

          event.preventDefault();

          status.innerHTML = "❌ Deletion Cancelled";

          status.style.color = "red";
        }
      });

      /*=====================================================
    DISPATCHER
=====================================================*/

      deleteBtn.addEventListener("click", function () {
        status.innerHTML = "Checking permission...";
        status.style.color = "blue";

        // Create a cancelable custom event
        const deleteRequest = new CustomEvent("before-delete", {
          bubbles: true, // Important Fix
          cancelable: true,
        });

        const wasAllowed = deleteBtn.dispatchEvent(deleteRequest);
        console.log("wasAllowed", wasAllowed);

        if (wasAllowed) {
          console.log("Deletion approved.");

          fileCard.innerHTML = `
            <h2>✅ File Deleted</h2>
            <p>The file has been removed successfully.</p>
        `;

          fileCard.style.borderColor = "green";
        } else {
          console.log("Deletion stopped.");
        }
      });
    </script>
  </body>
</html>
