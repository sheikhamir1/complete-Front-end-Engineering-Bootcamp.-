<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScript Debugging Demo</title>
  </head>
  <body>
    <h1>Add Two Numbers (Debugging Demo)</h1>

    <label>
      Number 1:
      <input type="text" id="number1" />
    </label>
    <br /><br />

    <label>
      Number 2:
      <input type="text" id="number2" />
    </label>
    <br /><br />

    <button onclick="onClick()">Add Number 1 and Number 2</button>

    <p id="label"></p>

    <script>
      var label = document.getElementById("label");

      function getNumber1() {
        return document.getElementById("number1").value;
      }

      function getNumber2() {
        return document.getElementById("number2").value;
      }

      function inputsAreEmpty() {
        return getNumber1() === "" || getNumber2() === "";
      }

      function updateLabel() {
        // ❌ BUG VERSION (for debugging demo)
        var addend1 = getNumber1();
        var addend2 = getNumber2();
        // var addend1 = parseInt(getNumber1());
        // var addend2 = parseInt(getNumber2());
        var sum = addend1 + addend2;

        console.log("addend1:", addend1, "addend2:", addend2, "sum:", sum);

        label.textContent = addend1 + " + " + addend2 + " = " + sum;
      }

      function onClick() {
        if (inputsAreEmpty()) {
          label.textContent = "Error: one or both inputs are empty.";
          return;
        }

        updateLabel();
      }
    </script>
  </body>
</html>
