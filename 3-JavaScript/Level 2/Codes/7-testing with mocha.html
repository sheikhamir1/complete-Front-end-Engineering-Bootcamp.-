<!doctype html>
<html lang="en">
  <head>
  <title>Mocha Test Demo</title>
  <!-- Mocha CSS -->

</head>
  </head>

  <body>
    <h1>Mocha Test Demo</h1>
    <div id="mocha"></div>

    <!-- function to test -->

    <script>
      function pow(x, n) {        // 2 ** 3 ----------- 2 ,2 ,2
        let result = 1; // 2 , 4 , 8
        for(let i = 0 ; i < n; i++){
            result *= x;
        }
        return result;
       
      }
      //   console.log(pow(2, 3));
      //   console.log(pow(3, 4));
    </script>

    <!-- Test -->

    <script src="test.js"></script>

    <!-- run Tests -->
    <script>
      mocha.run();
    </script>
  </body>
