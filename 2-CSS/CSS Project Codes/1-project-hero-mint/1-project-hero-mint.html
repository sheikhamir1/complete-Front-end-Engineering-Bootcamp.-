<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pastel Minimalism</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- <body style="zoom: 100%"> -->
  <body>
    <section class="hero-light">
      <nav class="navbar">
        <div class="logo">
          <div class="logo-box"></div>
          <span>Mint</span>
        </div>

        <div class="nav-links">
          <button>Products</button>
          <button>Solutions</button>
          <button>Pricing</button>
          <button>About</button>
        </div>

        <button class="btn-dark">Get Started</button>
      </nav>

      <div class="hero-content">
        <div class="hero-inner">
          <span class="badge">✨ Now In Public Beta</span>
          <h1>
            Build faster with
            <span class="gradient-text block">Intelligent Tools</span>
          </h1>

          <p>Stremline Your Workflow with our cutting-edge Platform.</p>

          <div class="cta">
            <button class="btn-primary">
              <span class="btn-text">Start Free Trail</span>
              <div class="btn-overlay"></div>
            </button>

            <button class="btn-outline">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"></path>
              </svg>
              Watch Demo
            </button>
          </div>
        </div>

        <div class="floating-area">
          <div class="floating-card">
            <div class="glass">
              <div class="icon green"></div>
              <p class="label">Revenu</p>
              <p class="value">+$124K</p>
            </div>
          </div>

          <div class="floating-card">
            <div class="glass">
              <div class="icon violet"></div>
              <p class="label">Users</p>
              <p class="value">+8,429</p>
            </div>
          </div>
        </div>

        <div class="bottom-fade"></div>
      </div>
    </section>
  </body>
</html>
