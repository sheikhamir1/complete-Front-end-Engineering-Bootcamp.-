<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Hero</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body style="zoom: 150%">
    <section class="hero">
      <div class="left-side">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>

        <nav class="navbar">
          <div class="logo">
            <div class="logo-box"></div>
            <span>Spark</span>
          </div>
          <button class="btn-sign">Sign In</button>
        </nav>

        <div class="content">
          <div class="max-w">
            <div class="fade delay1">
              <span class="badge">🔥 Hot: Summer Sale</span>
            </div>

            <h1 class="fade delay2">
              Ignite Your<br />
              <span class="gradient-text">Creative Spark</span>
            </h1>

            <p class="fade delay3">
              Unlock endless possibilities with our powerful toolkit.
            </p>

            <div class="cta fade delay4">
              <button class="btn-primary">
                <span>
                  Get Started Free
                  <svg viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                  </svg>
                </span>
                <div class="btn-overlay"></div>
              </button>

              <button class="btn-outline">Learn More</button>
            </div>

            <div class="features fade delay5">
              <div class="feature">⚡ Lightning fast performance</div>
              <div class="feature">🎨 Premium design assets</div>
              <div class="feature">🔒 Enterprise-grade security</div>
            </div>
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="right-bg">
          <div class="pulse-circle"></div>

          <div class="premium-card">
            <div class="glass-dark">
              <div class="premium-box">
                <div class="premium-icon"></div>
                <div>
                  <div class="premium-title">Premium Plan</div>
                  <div class="premium-price">$29/month</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
