<!doctype html>
<html>
  <head>
    <title>Complete Styled Form Demo</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f6f9;
      }

      h1 {
        text-align: center;
      }

      form {
        background: white;
        padding: 30px;
        border-radius: 8px;
        max-width: 700px;
        margin: auto;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      /* TEXT INPUTS */
      input[type="text"],
      input[type="password"],
      input[type="number"],
      input[type="email"] {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      /* FOCUS EFFECT */
      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="number"]:focus,
      input[type="email"]:focus {
        border: 2px solid #04aa6d;
        background-color: #e8f8f5;
        outline: none;
      }

      /* SEARCH INPUT WITH ICON + ANIMATION */
      input[type="search"] {
        width: 200px;
        padding: 10px 10px 10px 40px;
        margin: 10px 0;
        border-radius: 6px;
        border: 2px solid #ccc;
        background-image: url("https://cdn-icons-png.flaticon.com/16/622/622669.png");
        background-repeat: no-repeat;
        background-position: 10px center;
        transition: width 0.5s ease-in-out;
      }

      input[type="search"]:focus {
        width: 100%;
      }

      /* CHECKBOX & RADIO */
      input[type="checkbox"],
      input[type="radio"] {
        margin-right: 6px;
      }

      /* FILE INPUT */
      input[type="file"] {
        margin-top: 10px;
      }

      /* TEXTAREA */
      textarea {
        width: 100%;
        height: 120px;
        padding: 12px;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 6px;
        background-color: #f8f8f8;
        resize: none;
        font-size: 14px;
      }

      /* SELECT DROPDOWN */
      select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 2px solid #ccc;
        background-color: #f1f1f1;
        margin-top: 8px;
      }

      /* BUTTONS */
      input[type="submit"],
      input[type="reset"],
      input[type="button"] {
        background-color: #04aa6d;
        border: none;
        color: white;
        padding: 14px 20px;
        margin: 15px 5px 0 0;
        cursor: pointer;
        border-radius: 6px;
        font-size: 14px;
      }

      input[type="submit"]:hover,
      input[type="reset"]:hover,
      input[type="button"]:hover {
        background-color: #038c57;
      }

      /* RESPONSIVE */
      @media screen and (max-width: 600px) {
        form {
          padding: 15px;
        }
      }
    </style>
  </head>

  <body>
    <h1>Professional Styled Form</h1>

    <form>
      <label>First Name</label>
      <input type="text" placeholder="Enter first name" />

      <label>Email</label>
      <input type="email" placeholder="Enter email" />

      <label>Password</label>
      <input type="password" placeholder="Enter password" />

      <label>Age</label>
      <input type="number" placeholder="Enter age" />

      <label>Search</label>
      <input type="search" placeholder="Search..." />

      <label>Gender</label>
      <input type="radio" name="gender" /> Male
      <input type="radio" name="gender" /> Female

      <label>Skills</label>
      <input type="checkbox" /> HTML <input type="checkbox" /> CSS
      <input type="checkbox" /> JavaScript

      <label>Upload Resume</label>
      <input type="file" />

      <label>Country</label>
      <select>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
      </select>

      <label>About You</label>
      <textarea placeholder="Write something..."></textarea>

      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
      <input type="button" value="Button" />
    </form>
  </body>
</html>
