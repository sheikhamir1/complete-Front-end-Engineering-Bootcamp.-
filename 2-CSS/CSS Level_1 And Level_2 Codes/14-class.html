      body {
        margin: 0;
        padding: 40px;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
      }

      /* Gallery Container */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        perspective: 1000px;
      }

      /* Gallery Item */
      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        transition:
          transform 0.5s ease,
          box-shadow 0.3s ease;
        background: white;
      }

      .gallery-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
      }

      .gallery-item:hover {
        transform: rotateY(20deg) rotateX(-20deg) scale(1.05);
        box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.3);
      }

      /* Optional overlay */
      .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 10px;
        text-align: center;
        font-size: 14px;
      }
